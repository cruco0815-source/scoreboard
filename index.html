
<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SG Brietlingen-Adendorf Scoreboard</title>
<style>
body {
  margin: 0;
  background: #101d32;
  color: white;
  font-family: Arial, sans-serif;
  text-align: center;
}
header {
  padding: 20px 10px;
  border-bottom: 3px solid #39c5dc;
}
h1 { font-size: 20px; }
.scoreboard {
  display: flex;
  justify-content: space-around;
  align-items: center;
  padding: 25px 5px;
}
.team { width: 42%; }
.score {
  font-size: 65px;
  font-weight: bold;
}
.name { font-size: 16px; font-weight: bold; }
.controls { padding: 15px; }
button {
  border: 0;
  border-radius: 10px;
  padding: 14px 20px;
  margin: 5px;
  font-size: 18px;
  font-weight: bold;
  background: #39c5dc;
  color: #101d32;
}
.reset { background: #b83c48; color: white; }
.live { color: #ff5555; font-weight: bold; }
</style>
</head>
<body>

<header>
  <div class="live">● LIVE</div>
  <h1>BADMINTON · PUNKTSPIEL</h1>
  <h2>SG BRIETLINGEN-ADENDORF</h2>
</header>

<div class="scoreboard">
  <div class="team">
    <div class="name">SG Brietlingen-Adendorf</div>
    <div class="score" id="home">0</div>
    <button onclick="change('home',1)">+1</button>
    <button onclick="change('home',-1)">−1</button>
  </div>

  <div style="font-size:35px">:</div>

  <div class="team">
    <div class="name">Gastmannschaft</div>
    <div class="score" id="guest">0</div>
    <button onclick="change('guest',1)">+1</button>
    <button onclick="change('guest',-1)">−1</button>
  </div>
</div>

<div class="controls">
  <button class="reset" onclick="resetScore()">
    Spielstand zurücksetzen
  </button>
</div>

<script>
let home = 0;
let guest = 0;

function change(team, amount) {
  if (team === 'home') {
    home = Math.max(0, home + amount);
    document.getElementById('home').textContent = home;
  } else {
    guest = Math.max(0, guest + amount);
    document.getElementById('guest').textContent = guest;
  }
}

function resetScore() {
  home = 0;
  guest = 0;
  document.getElementById('home').textContent = 0;
  document.getElementById('guest').textContent = 0;
}
</script>

</body>
</html>
